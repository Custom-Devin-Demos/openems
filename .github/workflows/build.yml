name: Build OpenEMS
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
  
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - uses: kiancross/checkstyle-annotations-action@16cac2b2825757b1fd66d804d885ad41a8c5f393 # v1.0.0

      - name: Checkstyle
        run: ./gradlew checkstyleAll --console=colored --warn

      - name: Build all Java packages
        run: ./gradlew build --console=colored --warn

      - name: Resolve OpenEMS bundles
        run: ./gradlew resolve --console=colored --warn

      - name: Validate BackendApp.bndrun
        run: git diff --exit-code io.openems.backend.application/BackendApp.bndrun

      - name: Validate EdgeApp.bndrun
        run: git diff --exit-code io.openems.edge.application/EdgeApp.bndrun

      - name: Generate JaCoCo Code-coverage-report
        run: ./gradlew jacocoLogAggregatedCoverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}

  us-grid-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Run US grid bundle tests
        run: |
          tasks=()
          for bundle in \
            io.openems.edge.timeofusetariff.comed \
            io.openems.edge.timeofusetariff.pjm \
            io.openems.edge.greenbutton \
            io.openems.edge.controller.api.openadr \
            io.openems.backend.openadr.vtn; do
            if [ -d "$bundle" ]; then
              tasks+=(":$bundle:test")
            else
              echo "::notice::Bundle $bundle not present in this checkout, skipping"
            fi
          done
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::notice::No US grid bundles present, nothing to test"
            exit 0
          fi
          # JUnit XML reports are disabled in build.gradle.kts; re-enable them for the artifact upload.
          cat > "$RUNNER_TEMP/junit-xml.init.gradle.kts" <<'EOF'
          gradle.projectsEvaluated {
            allprojects {
              tasks.withType<Test>().configureEach {
                reports.junitXml.required.set(true)
              }
            }
          }
          EOF
          ./gradlew "${tasks[@]}" --continue --console=colored --warn \
            --init-script "$RUNNER_TEMP/junit-xml.init.gradle.kts"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: us-grid-test-reports
          path: |
            io.openems.edge.timeofusetariff.comed/generated/test-reports/test/*.xml
            io.openems.edge.timeofusetariff.pjm/generated/test-reports/test/*.xml
            io.openems.edge.greenbutton/generated/test-reports/test/*.xml
            io.openems.edge.controller.api.openadr/generated/test-reports/test/*.xml
            io.openems.backend.openadr.vtn/generated/test-reports/test/*.xml
          if-no-files-found: ignore

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Cache for Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.ng
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Build OpenEMS UI
        run: |
          cd ui
          npm ci --prefer-offline --cache ~/.npm
          node_modules/.bin/ng config cli.cache.path "~/.ng"
          npm run lint
          node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"
          export CHROME_BIN=/usr/bin/google-chrome-stable
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ui
          directory: ./ui/
          token: ${{ secrets.CODECOV_TOKEN }}
